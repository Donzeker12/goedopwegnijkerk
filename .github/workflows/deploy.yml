name: Deploy naar productie

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST || '187.124.27.250' }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME || vars.SSH_USERNAME || 'root' }}
      SSH_PORT: ${{ secrets.SSH_PORT || vars.SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      - name: Controleer deploy configuratie
        run: |
          [ -n "$SSH_HOST" ] || { echo "::error::Missing SSH host. Set secret SSH_HOST or variable SSH_HOST."; exit 1; }
          [ -n "$SSH_USERNAME" ] || { echo "::error::Missing SSH username. Set secret SSH_USERNAME or variable SSH_USERNAME."; exit 1; }
          [ -n "$SSH_PRIVATE_KEY" ] || { echo "::error::Missing SSH private key. Set secret SSH_PRIVATE_KEY."; exit 1; }

      - name: Verbinding maken met server en deployen
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            bash /var/www/goedopwegnijkerk/deploy.sh
