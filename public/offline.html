<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline | Goed Op Weg Admin</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #f9fafb, #e5e7eb);
      color: #111827;
      padding: 20px;
    }

    .card {
      width: min(480px, 100%);
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 12px 24px rgba(17, 24, 39, 0.08);
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
    }

    p {
      margin: 0;
      line-height: 1.55;
      color: #374151;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Je bent offline</h1>
    <p>De app werkt deels offline. Zodra je weer verbinding hebt, worden backendgegevens automatisch opnieuw opgehaald.</p>
  </main>
</body>
</html>
